name: sreon
services:
  configure:
    image: node:22-alpine
    command: ["node", "/setup/init.mjs"]
    volumes:
      - ./searxng:/setup:ro
      - search-config:/etc/searxng
    network_mode: none
    restart: "no"
  search:
    image: docker.io/searxng/searxng:latest
    restart: unless-stopped
    depends_on:
      configure:
        condition: service_completed_successfully
    environment:
      SEARXNG_SETTINGS_PATH: /etc/searxng/settings.yml
      GRANIAN_HOST: 0.0.0.0
      GRANIAN_PORT: 8080
      GRANIAN_ACCESS_LOG_ENABLED: "false"
    volumes:
      - search-config:/etc/searxng
      - search-data:/var/cache/searxng
    logging:
      driver: none
  sreon:
    build: .
    restart: unless-stopped
    ports:
      - "127.0.0.1:${PORT:-3000}:3000"
    environment:
      SEARXNG_URL: http://search:8080
    depends_on:
      search:
        condition: service_started
    read_only: true
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
volumes:
  search-config:
  search-data:
