<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="robots" content="noindex, nofollow">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>·</title>
<style>
  :root{
    --accent:#5B21B6; --accent-bright:#7C3AED; --accent-soft:#ECE4FA;
    --bg:#0d0b14; --panel:#161320; --ink:#0f0d16; --text:#eee6ff;
  }
  *{ box-sizing:border-box; }
  html,body{
    margin:0; min-height:100%; background:var(--bg); color:var(--text);
    font-family:-apple-system,"SF Pro Text",sans-serif;
  }
  #shell{
    max-width:720px; margin:0 auto; padding:24px 16px 60px;
    display:flex; flex-direction:column; min-height:100vh;
  }
  header{ display:flex; align-items:center; justify-content:space-between; margin-bottom:14px; }
  header h1{ font-size:15px; font-weight:600; letter-spacing:.02em; margin:0; color:var(--accent-bright); }
  header a{ font-size:11px; color:rgba(255,255,255,0.35); text-decoration:none; }
  header a:hover{ color:rgba(255,255,255,0.6); }

  #keyRow{
    display:flex; gap:8px; margin-bottom:8px;
  }
  #keyInput{
    flex:1; padding:9px 12px; border-radius:10px; border:1px solid rgba(255,255,255,0.1);
    background:var(--panel); color:var(--text); font-size:12.5px; outline:none;
  }
  #keyInput:focus{ border-color:var(--accent-bright); }
  #saveKeyBtn{
    padding:9px 16px; border-radius:10px; border:none; cursor:pointer;
    background:var(--accent); color:white; font-size:12.5px; font-weight:600;
  }
  #saveKeyBtn:hover{ background:var(--accent-bright); }
  #keyNote{ font-size:10.5px; color:rgba(255,255,255,0.3); margin:0 0 16px; }

  #statusRow{
    display:flex; align-items:center; gap:8px; margin-bottom:16px;
    font-size:11.5px; color:rgba(255,255,255,0.5);
  }
  #statusDot{ width:8px; height:8px; border-radius:50%; background:#666; flex:none; }
  #statusDot.online{ background:#4ade80; box-shadow:0 0 6px #4ade80; }
  #statusDot.offline{ background:#ff6b6b; box-shadow:0 0 6px #ff6b6b; }
  #modelSelect{
    margin-left:auto; background:var(--panel); color:var(--text);
    border:1px solid rgba(255,255,255,0.1); border-radius:8px;
    font-size:11px; padding:4px 8px;
  }

  #chat{
    flex:1; display:flex; flex-direction:column; gap:12px; overflow-y:auto;
    padding-bottom:16px;
  }
  .msg{ max-width:85%; padding:10px 14px; border-radius:14px; font-size:13.5px; line-height:1.5; white-space:pre-wrap; }
  .msg.user{ align-self:flex-end; background:var(--accent); color:white; border-bottom-right-radius:4px; }
  .msg.ai{ align-self:flex-start; background:var(--panel); border:1px solid rgba(255,255,255,0.06); border-bottom-left-radius:4px; }
  .msg.attach{ font-size:11px; opacity:0.7; }

  .file-card{
    align-self:flex-start; max-width:85%; background:var(--panel);
    border:1px solid rgba(124,58,237,0.35); border-radius:12px;
    padding:12px 14px; display:flex; align-items:center; gap:12px;
  }
  .file-card .icon{ font-size:20px; }
  .file-card .meta{ flex:1; min-width:0; }
  .file-card .fname{ font-size:12.5px; font-weight:600; color:var(--text); word-break:break-all; }
  .file-card .fsize{ font-size:10.5px; color:rgba(255,255,255,0.4); margin-top:2px; }
  .file-card .dl-btn{
    padding:7px 14px; border-radius:9px; border:none; cursor:pointer;
    background:var(--accent-bright); color:white; font-size:11.5px; font-weight:600;
    white-space:nowrap;
  }
  .file-card .dl-btn:hover{ filter:brightness(1.12); }

  #composer{
    display:flex; gap:8px; align-items:flex-end; margin-top:auto;
    background:var(--panel); border:1px solid rgba(255,255,255,0.08);
    border-radius:14px; padding:8px 8px 8px 14px;
  }
  #uploadBtn{
    background:none; border:none; color:rgba(255,255,255,0.5); font-size:18px;
    cursor:pointer; padding:4px 6px;
  }
  #uploadBtn:hover{ color:var(--accent-bright); }
  #msgInput{
    flex:1; background:none; border:none; color:var(--text); font-size:13.5px;
    outline:none; resize:none; max-height:120px; padding:6px 0; font-family:inherit;
  }
  #sendBtn{
    background:var(--accent); color:white; border:none; border-radius:10px;
    padding:9px 16px; font-size:12.5px; font-weight:600; cursor:pointer;
  }
  #sendBtn:hover{ background:var(--accent-bright); }
  #sendBtn:disabled{ opacity:0.4; cursor:default; }

  #pendingFile{
    display:none; align-items:center; gap:8px; font-size:11.5px;
    color:rgba(255,255,255,0.6); margin-bottom:8px; background:var(--panel);
    border-radius:10px; padding:6px 12px; align-self:flex-start;
  }
  #pendingFile .x{ cursor:pointer; color:#ff8a8a; font-weight:700; }

  #status{ font-size:11px; color:rgba(255,255,255,0.35); text-align:center; margin-top:8px; min-height:14px; }
</style>
</head>
<body>
<div id="shell">
  <header>
    <h1>secret area</h1>
    <a href="index.html">← back</a>
  </header>

  <div id="keyRow">
    <input id="keyInput" type="password" placeholder="Paste your Gemini API key">
    <button id="saveKeyBtn" onclick="saveKey()">Save</button>
  </div>
  <div id="keyNote">Saved only in this browser's storage. Never committed to the repo, never sent anywhere except Google's API when you chat.</div>

  <div id="statusRow">
    <div id="statusDot"></div>
    <span id="statusText">no key saved yet</span>
    <select id="modelSelect">
      <option value="gemini-2.0-flash">gemini-2.0-flash</option>
      <option value="gemini-2.5-flash">gemini-2.5-flash</option>
      <option value="gemini-2.5-pro">gemini-2.5-pro</option>
    </select>
  </div>

  <div id="chat"></div>

  <div id="pendingFile">
    <span id="pendingFileName"></span>
    <span class="x" onclick="clearPendingFile()">✕</span>
  </div>

  <div id="composer">
    <input type="file" id="fileInput" style="display:none" onchange="handleFileSelect(event)">
    <button id="uploadBtn" onclick="document.getElementById('fileInput').click()" title="Attach a file">📎</button>
    <textarea id="msgInput" rows="1" placeholder="Save your API key above first..." onkeydown="handleKeydown(event)" disabled></textarea>
    <button id="sendBtn" onclick="sendMessage()" disabled>Send</button>
  </div>
  <div id="status"></div>
</div>

<script>
const chatEl = document.getElementById('chat');
const statusEl = document.getElementById('status');
let pendingFile = null; // { name, content }
let history = []; // { role, parts: [{text}] } — Gemini's message shape

function setChatEnabled(enabled){
  document.getElementById('msgInput').disabled = !enabled;
  document.getElementById('sendBtn').disabled = !enabled;
  document.getElementById('msgInput').placeholder = enabled ? 'Ask something...' : 'Save your API key above first...';
}

function loadKey(){
  const k = localStorage.getItem('sreon_secret_gemini_key');
  if(k){
    document.getElementById('keyInput').value = k;
    markKeySaved();
  }
}
function markKeySaved(){
  document.getElementById('statusDot').className = 'online';
  document.getElementById('statusText').textContent = 'key saved — ready to chat';
  setChatEnabled(true);
}
function saveKey(){
  const k = document.getElementById('keyInput').value.trim();
  if(!k){
    document.getElementById('statusDot').className = 'offline';
    document.getElementById('statusText').textContent = 'no key saved yet';
    setChatEnabled(false);
    return;
  }
  localStorage.setItem('sreon_secret_gemini_key', k);
  markKeySaved();
}
loadKey();

function handleKeydown(e){
  if(e.key === 'Enter' && !e.shiftKey){
    e.preventDefault();
    sendMessage();
  }
}

function handleFileSelect(e){
  const file = e.target.files[0];
  if(!file) return;
  const reader = new FileReader();
  reader.onload = () => {
    pendingFile = { name: file.name, content: reader.result };
    document.getElementById('pendingFileName').textContent = '📎 ' + file.name;
    document.getElementById('pendingFile').style.display = 'flex';
  };
  reader.readAsText(file);
  e.target.value = '';
}
function clearPendingFile(){
  pendingFile = null;
  document.getElementById('pendingFile').style.display = 'none';
}

function addMsg(role, text){
  const div = document.createElement('div');
  div.className = 'msg ' + role;
  div.textContent = text;
  chatEl.appendChild(div);
  chatEl.scrollTop = chatEl.scrollHeight;
  return div;
}

function addFileCard(filename, content){
  const card = document.createElement('div');
  card.className = 'file-card';
  const sizeKb = (new Blob([content]).size / 1024).toFixed(1);
  card.innerHTML = `
    <div class="icon">📄</div>
    <div class="meta">
      <div class="fname">${escapeHtml(filename)}</div>
      <div class="fsize">${sizeKb} KB</div>
    </div>
    <button class="dl-btn">Download</button>
  `;
  card.querySelector('.dl-btn').addEventListener('click', () => downloadFile(filename, content));
  chatEl.appendChild(card);
  chatEl.scrollTop = chatEl.scrollHeight;
}

function downloadFile(filename, content){
  const blob = new Blob([content], { type: 'text/plain' });
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url; a.download = filename;
  document.body.appendChild(a); a.click(); a.remove();
  URL.revokeObjectURL(url);
}

function escapeHtml(s){
  return String(s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
}

// Extracts fenced code/file blocks from a reply and returns
// { cleanedText, files: [{filename, content}] }
function extractFiles(text){
  const files = [];
  const fenceRe = /```(?:filename:\s*(\S+)\n)?([a-zA-Z0-9_+-]*)\n([\s\S]*?)```/g;
  let cleaned = text;
  let match;
  let i = 0;
  while((match = fenceRe.exec(text)) !== null){
    i++;
    const explicitName = match[1];
    const lang = match[2] || 'txt';
    const body = match[3];
    const filename = explicitName || `output-${i}.${lang || 'txt'}`;
    files.push({ filename, content: body });
    cleaned = cleaned.replace(match[0], `[file: ${filename}]`);
  }
  return { cleaned, files };
}

async function sendMessage(){
  const key = localStorage.getItem('sreon_secret_gemini_key');
  if(!key){ statusEl.textContent = 'Save your API key first.'; return; }

  const input = document.getElementById('msgInput');
  const text = input.value.trim();
  if(!text && !pendingFile) return;

  let apiText = text;

  if(pendingFile){
    addMsg('user', text || '(sent a file)');
    const fileMsg = document.createElement('div');
    fileMsg.className = 'msg attach';
    fileMsg.textContent = '📎 ' + pendingFile.name;
    chatEl.appendChild(fileMsg);
    apiText = `${text}\n\n[Attached file: ${pendingFile.name}]\n${pendingFile.content}`;
  } else {
    addMsg('user', text);
  }

  input.value = '';
  clearPendingFile();

  history.push({ role: 'user', parts: [{ text: apiText }] });

  setChatEnabled(false);
  statusEl.textContent = 'thinking...';

  const model = document.getElementById('modelSelect').value;
  const url = `https://generativelanguage.googleapis.com/v1beta/models/${model}:generateContent?key=${encodeURIComponent(key)}`;

  const systemInstruction = {
    parts: [{ text: 'You are a helpful assistant. If you produce a file or code the user should save, wrap it in a fenced code block. You can optionally start the fence with "filename: name.ext" on its own line before the language tag.' }]
  };

  try{
    const res = await fetch(url, {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ contents: history, systemInstruction })
    });
    const data = await res.json();

    if(data.error){
      addMsg('ai', 'Error: ' + data.error.message);
    } else {
      const candidate = data.candidates && data.candidates[0];
      const replyText = candidate && candidate.content && candidate.content.parts
        ? candidate.content.parts.map(p => p.text || '').join('\n')
        : '(empty response)';
      history.push({ role: 'model', parts: [{ text: replyText }] });

      const { cleaned, files } = extractFiles(replyText);
      if(cleaned.trim()) addMsg('ai', cleaned.trim());
      files.forEach(f => addFileCard(f.filename, f.content));
    }
  } catch(err){
    addMsg('ai', 'Request failed: ' + err.message);
  }

  statusEl.textContent = '';
  setChatEnabled(true);
}
</script>
</body>
</html>
