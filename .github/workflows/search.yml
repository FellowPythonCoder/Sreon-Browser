name: Check search sources
on:
  workflow_dispatch:
  push:
    branches: [arena/01a0bffb-sreon-browser]
    paths: [.github/workflows/search.yml]
permissions:
  contents: read
jobs:
  sources:
    runs-on: macos-14
    steps:
      - name: Check public web search feed
        id: web
        shell: python
        run: |
          import os, urllib.request, xml.etree.ElementTree as ET
          url = 'https://www.bing.com/search?format=rss&q=YouTube&count=20'
          request = urllib.request.Request(url, headers={'User-Agent':'Sreon/0.4.0 (https://github.com/FellowPythonCoder/Sreon-Browser)'})
          try:
              with urllib.request.urlopen(request, timeout=10) as response:
                  tree = ET.fromstring(response.read(3000000))
              links = [item.findtext('link', '') for item in tree.findall('./channel/item')]
              status = 'YouTube web result verified' if any('youtube.com' in link for link in links) else 'No YouTube destination found'
          except Exception as error:
              status = 'Feed unavailable'
              print(str(error))
          with open(os.environ['GITHUB_OUTPUT'], 'a') as output:
              output.write('status=' + status + '\n')
      - name: "Web source: ${{ steps.web.outputs.status }}"
        run: echo '${{ steps.web.outputs.status }}'
