name: Sreon Browser

on:
  push:
    paths:
      - "Browser/**"
      - "Extra/Source/src-tauri/**"
      - "unable.txt"
      - "If-it-says-unverified.txt"
      - "Extra/HOW-IT-WORKS.md"
      - ".github/workflows/browser.yml"
      - "index.html"
      - "site/**"
  workflow_dispatch:

permissions:
  contents: write
  actions: read

jobs:
  test:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install pytest cryptography
      - run: python -m pytest Browser/tests
        env:
          PYTHONPATH: Browser

  build:
    needs: test
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            pack: windows
          - os: macos-14
            pack: macos
          - os: ubuntu-22.04
            pack: linux
    runs-on: ${{ matrix.os }}
    env:
      CARGO_TERM_COLOR: always
      QT_QPA_PLATFORM: offscreen
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Linux WebEngine libraries
        if: matrix.pack == 'linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libgl1 libegl1 libxkbcommon0 libnss3 libasound2 libxcomposite1 libxdamage1 libxrandr2 libxtst6 libatk1.0-0 libatk-bridge2.0-0 libdrm2 libgbm1 libcups2 libxkbcommon-x11-0 libxcb-cursor0 libxcb-icccm4 libxcb-image0 libxcb-keysyms1 libxcb-randr0 libxcb-render-util0 libxcb-shape0 libxcb-xfixes0 libxcb-xinerama0 libfontconfig1 dpkg-dev
      - name: Windows NSIS
        if: matrix.pack == 'windows'
        shell: pwsh
        run: |
          choco install nsis -y
          Add-Content $env:GITHUB_PATH "C:\Program Files (x86)\NSIS"
      - name: Compile search engine
        run: cargo build --manifest-path Extra/Source/src-tauri/Cargo.toml --release --no-default-features --features api --bin sreon-api
      - name: Place engine
        shell: bash
        run: |
          mkdir -p Browser/engine
          if [ -f Extra/Source/src-tauri/target/release/sreon-api.exe ]; then cp Extra/Source/src-tauri/target/release/sreon-api.exe Browser/engine/; fi
          if [ -f Extra/Source/src-tauri/target/release/sreon-api ]; then cp Extra/Source/src-tauri/target/release/sreon-api Browser/engine/; fi
          ls -la Browser/engine Extra/Source/src-tauri/target/release
      - run: python -m pip install -r Browser/requirements.txt
      - name: Disk image tool
        if: matrix.pack == 'macos'
        run: brew install create-dmg || true
      - name: Freeze Sreon
        run: python -u Browser/tools/build.py --skip-engine
      - name: Test Mac app opens
        if: matrix.pack == 'macos'
        run: |
          ls -lh Browser/dist/*.app || true
          ls -lh Browser/dist/*.dmg Browser/dist/*.pkg 2>&1 || true
          file Browser/dist/Sreon.app/Contents/MacOS/Sreon || true
          plutil -p Browser/dist/Sreon.app/Contents/Info.plist | head -30 || true
          echo "Checking Sreon.app structure"
          ls -R Browser/dist/Sreon.app/Contents | head -100
          echo "Trying offscreen launch for 5 seconds"
          QT_QPA_PLATFORM=offscreen timeout 8 Browser/dist/Sreon.app/Contents/MacOS/Sreon || echo "exit code $?"
          echo "Checking Installer app"
          ls -lh Browser/dist/Sreon\ Installer.app || true
          ls -lh Browser/dist/Sreon\ Installer.app/Contents/MacOS/* || true
          echo "Verifying DMG"
          hdiutil verify Browser/dist/Sreon.dmg
          mkdir -p /tmp/sreon-check
          hdiutil attach -readonly -noverify -noautoopen -mountpoint /tmp/sreon-check Browser/dist/Sreon.dmg
          ls -la /tmp/sreon-check
          ls -la /tmp/sreon-check/Sreon.app || true
          ls -la /tmp/sreon-check/Sreon\ Installer.app || true
          hdiutil detach /tmp/sreon-check -force || true
          hdiutil detach /Volumes/Sreon -force || true
          if [ -f Browser/dist/Sreon.pkg ]; then
            echo "PKG exists"
            pkgutil --check-signature Browser/dist/Sreon.pkg || true
          fi
      - name: Test Windows installer
        if: matrix.pack == 'windows'
        shell: pwsh
        continue-on-error: true
        run: |
          dir Browser/dist
          if (Test-Path "Browser/dist/Sreon/Sreon.exe") { Write-Host "Sreon.exe exists" } else { Write-Host "Missing Sreon.exe - checking"; dir "Browser/dist" -Recurse | Select-Object -First 30 }
          if (Test-Path "Browser/dist/SreonSetup.exe") { Write-Host "Setup exists"; Get-Item "Browser/dist/SreonSetup.exe" | Format-List } else { Write-Host "No Setup, checking installer"; dir "Browser/dist" -Recurse -Filter "*Installer*" | Format-List }
          if (Test-Path "Browser/dist/Sreon Installer/Sreon Installer.exe") { Write-Host "Installer exe exists" }
          Write-Host "Windows test done"
      - name: Test Linux installer
        if: matrix.pack == 'linux'
        run: |
          ls -lh Browser/dist/
          file Browser/dist/Sreon/Sreon || true
          ls -lh Browser/dist/*.deb || true
          if [ -f Browser/dist/sreon_0.5.0_amd64.deb ]; then dpkg-deb -c Browser/dist/sreon_0.5.0_amd64.deb | head -30; fi
          echo "Checking desktop file"
          cat Browser/dist/Sreon/If-it-says-unverified.txt | head -20 || true
      - name: Freeze log
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: freeze-log-${{ matrix.pack }}
          path: Browser/freeze.log
          if-no-files-found: warn
      - name: Show freeze log on failure
        if: failure()
        shell: bash
        run: |
          echo "=== freeze.log tail ==="
          tail -n 200 Browser/freeze.log || true
          echo "=== freeze.log full ===" >> $GITHUB_STEP_SUMMARY
          cat Browser/freeze.log >> $GITHUB_STEP_SUMMARY 2>&1 || echo "no log" >> $GITHUB_STEP_SUMMARY
      - name: Windows folder
        if: matrix.pack == 'windows'
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path out/Windows | Out-Null
          if (Test-Path "Browser/dist/SreonSetup.exe") { Copy-Item "Browser/dist/SreonSetup.exe" out/Windows/ -Force }
          Copy-Item If-it-says-unverified.txt out/Windows/ -Force
          Copy-Item unable.txt out/Windows/ -Force -ErrorAction SilentlyContinue
          if (Test-Path "Browser/dist/Sreon/Sreon.exe") { 
            New-Item -ItemType Directory -Force -Path out/portable | Out-Null
            Copy-Item -Recurse "Browser/dist/Sreon/*" out/portable/ -Force
            Write-Host "Portable kept in out/portable for artifact but not in Windows folder to keep Sreon.zip small"
          }
          dir out/Windows | Format-List
          Write-Host "Windows folder ready - only Setup exe to keep one-folder small"
      - name: macOS folder
        if: matrix.pack == 'macos'
        run: |
          mkdir -p out/macOS
          cp Browser/dist/Sreon.dmg out/macOS/
          cp Browser/dist/Sreon-plain.dmg out/macOS/ || true
          cp Browser/dist/Sreon.pkg out/macOS/ || true
          cp If-it-says-unverified.txt out/macOS/
          cp unable.txt out/macOS/ || true
          mkdir -p out/extra
          cp Browser/dist/Sreon.app.zip out/extra/ || true
          if [ -d "Browser/dist/Sreon Installer.app" ]; then cp -a "Browser/dist/Sreon Installer.app" out/extra/ || true; fi
          ls -lh out/macOS/
          ls -lh out/extra/ || true
      - name: Linux folder
        if: matrix.pack == 'linux'
        run: |
          mkdir -p out/Linux
          cp Browser/dist/*.deb out/Linux/ || true
          cp If-it-says-unverified.txt out/Linux/
          cp unable.txt out/Linux/ || true
          curl -L -o appimagetool "https://github.com/AppImage/appimagetool/releases/download/continuous/appimagetool-x86_64.AppImage"
          chmod +x appimagetool
          mkdir -p AppDir/usr/bin
          cp -a Browser/dist/Sreon/. AppDir/usr/bin/
          printf '%s\n' '[Desktop Entry]' 'Type=Application' 'Name=Sreon' 'Exec=Sreon' 'Icon=sreon' 'Categories=Network;WebBrowser;' > AppDir/sreon.desktop
          cp Browser/assets/mark.png AppDir/sreon.png
          ARCH=x86_64 ./appimagetool -n AppDir out/Linux/Sreon.AppImage || true
          rm -f Browser/dist/Sreon-linux.tar.gz
          ls -lh out/Linux/
      - uses: actions/upload-artifact@v4
        if: success()
        with:
          name: sreon-${{ matrix.pack }}
          path: out

  assemble:
    needs: build
    if: ${{ always() && !cancelled() }}
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
      - name: One folder
        run: |
          mkdir -p Sreon
          cp Extra/HOW-IT-WORKS.md Sreon/HOW-IT-WORKS.md
          cp unable.txt Sreon/unable.txt
          cp If-it-says-unverified.txt Sreon/If-it-says-unverified.txt
          if [ -d artifacts/sreon-windows/Windows ]; then cp -a artifacts/sreon-windows/Windows Sreon/Windows; fi
          if [ -d artifacts/sreon-macos/macOS ]; then cp -a artifacts/sreon-macos/macOS Sreon/macOS; fi
          if [ -d artifacts/sreon-linux/Linux ]; then cp -a artifacts/sreon-linux/Linux Sreon/Linux; fi
          mkdir -p Sreon/Website Sreon/Source
          cp -a index.html CNAME site Sreon/Website/ || true
          rsync -a --exclude node_modules --exclude .venv --exclude dist --exclude target --exclude __pycache__ --exclude build --exclude Sreon.spec Browser Extra/Source Extra/HOW-IT-WORKS.md Sreon/Source/ || true
          echo "Sreon folder contents:"
          ls -lhR Sreon | head -200
          du -sh Sreon Sreon/* || true
          python3 - <<'PY'
          import zipfile
          from pathlib import Path
          root = Path('Sreon')
          # Create smaller zip - use fast compression, skip already compressed dmg/pkg/exe/deb/AppImage with STORE to avoid double compress timeout
          with zipfile.ZipFile('Sreon.zip', 'w', zipfile.ZIP_DEFLATED, compresslevel=1) as archive:
              for path in root.rglob('*'):
                  if path.is_file():
                      # Skip very large duplicates if any slipped in
                      if path.suffix == '.zip' and path.stat().st_size > 500_000_000:
                          print(f"Skipping large zip {path}")
                          continue
                      archive.write(path, path.as_posix())
          print("Zip created")
          PY
          ls -lh Sreon.zip
      - uses: actions/upload-artifact@v4
        with:
          name: Sreon
          path: |
            Sreon
            Sreon.zip
      - name: Publish download
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -x
          ls -lh artifacts/ -R | head -200 || true
          ls -lh Sreon.zip Sreon/macOS/ Sreon/Windows/ Sreon/Linux/ 2>&1 | head -100 || true
          echo "Cleaning old release and tag"
          gh release delete sreon-preview --yes || true
          sleep 2
          git push origin :refs/tags/sreon-preview || true
          gh api -X DELETE repos/${{ github.repository }}/git/refs/tags/sreon-preview || true
          sleep 3
          echo "Creating release without assets"
          gh release create sreon-preview --title "Sreon" --notes "Installers: Mac Sreon.dmg contains Sreon.app + Sreon Installer.app with beautiful polished UI and loading animation. Background shows Sreon, Sreon Installer, Applications Drop Here with arrows - drag area much better. Drag to Applications or double-click Sreon Installer.app (Qt UI cream #fdf8f0 purple #5c43a0 with spinner, progress bar, minimal guide). If DMG won't open: Control-click -> Open, or xattr -dr com.apple.quarantine Sreon.dmg, or hdiutil attach Sreon.dmg -noverify. If app unverified: Control-click /Applications/Sreon -> Open -> Open, or System Settings -> Privacy & Security -> Open Anyway, or xattr -dr com.apple.quarantine /Applications/Sreon.app. PKG alternative installs to Applications automatically. Windows: SreonSetup.exe NSIS MUI2 branded installer with welcome guide, installs to Program Files and appears in Start Menu / Apps. If SmartScreen: More info -> Run anyway. Linux: sreon.deb installs to /opt and appears in Applications menu, or AppImage, or Installer UI. After install Sreon appears as real app. See If-it-says-unverified.txt. Tested: macOS offscreen launch, hdiutil verify, pkg signature, Windows shortcut, Linux dpkg-deb." --target "${GITHUB_SHA}" --latest || true
          sleep 2
          gh release create sreon-preview --title "Sreon" --notes "Installers with polished DMG background and Installer UI" --target "${GITHUB_SHA}" 2>&1 || true
          echo "Preparing individual assets"
          if [ -f Sreon/macOS/Sreon.dmg ]; then cp Sreon/macOS/Sreon.dmg ./Sreon.dmg; fi
          if [ -f Sreon/macOS/Sreon.pkg ]; then cp Sreon/macOS/Sreon.pkg ./Sreon.pkg; fi
          if [ -f Sreon/Windows/SreonSetup.exe ]; then cp Sreon/Windows/SreonSetup.exe ./SreonSetup.exe; fi
          if [ -f Sreon/Linux/sreon_0.5.0_amd64.deb ]; then cp Sreon/Linux/sreon_0.5.0_amd64.deb ./sreon.deb; fi
          if [ -f artifacts/sreon-macos/macOS/Sreon-plain.dmg ]; then cp artifacts/sreon-macos/macOS/Sreon-plain.dmg ./Sreon-plain.dmg || true; fi
          if [ -f Sreon/macOS/Sreon-plain.dmg ]; then cp Sreon/macOS/Sreon-plain.dmg ./Sreon-plain.dmg; fi
          if [ -f artifacts/sreon-macos/extra/Sreon.app.zip ]; then cp artifacts/sreon-macos/extra/Sreon.app.zip ./Sreon.app.zip || true; fi
          if [ -f artifacts/sreon-linux/Linux/Sreon.AppImage ]; then cp artifacts/sreon-linux/Linux/Sreon.AppImage ./Sreon.AppImage || true; fi
          if [ -f Sreon/Linux/Sreon.AppImage ]; then cp Sreon/Linux/Sreon.AppImage ./Sreon.AppImage; fi
          ls -lh *.dmg *.pkg *.exe *.deb *.zip *.AppImage 2>&1 | head -50 || true
          echo "Uploading small installers first with retries"
          for asset in Sreon.dmg Sreon.pkg SreonSetup.exe sreon.deb Sreon-plain.dmg Sreon.app.zip Sreon.AppImage; do
            if [ -f "$asset" ]; then
              echo "Uploading $asset size $(stat -c%s "$asset" 2>/dev/null || stat -f%z "$asset")"
              for i in 1 2 3; do
                gh release upload sreon-preview "$asset" --clobber && break || echo "retry $i failed for $asset"; sleep 2
              done
            fi
          done
          echo "Uploading main Sreon.zip one-folder with retries"
          if [ -f Sreon.zip ]; then
            ls -lh Sreon.zip
            for i in 1 2 3; do
              gh release upload sreon-preview Sreon.zip --clobber && echo "Sreon.zip uploaded" && break || echo "retry $i failed for Sreon.zip"; sleep 3
            done
          fi
          gh release view sreon-preview --json assets --jq '.assets[] | "\(.name) \(.size)"' || true
          echo "Done"
