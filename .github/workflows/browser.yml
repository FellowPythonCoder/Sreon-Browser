name: Sreon Browser

on:
  push:
    paths:
      - "Browser/**"
      - "Extra/Source/src-tauri/**"
      - "unable.txt"
      - "If-it-says-unverified.txt"
      - "Extra/HOW-IT-WORKS.md"
      - ".github/workflows/browser.yml"
      - "index.html"
      - "site/**"
  workflow_dispatch:

permissions:
  contents: write
  actions: read

jobs:
  test:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install pytest cryptography
      - run: python -m pytest Browser/tests
        env:
          PYTHONPATH: Browser

  build:
    needs: test
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            pack: windows
          - os: macos-14
            pack: macos
          - os: ubuntu-22.04
            pack: linux
    runs-on: ${{ matrix.os }}
    env:
      CARGO_TERM_COLOR: always
      QT_QPA_PLATFORM: offscreen
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Linux WebEngine libraries
        if: matrix.pack == 'linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libgl1 libegl1 libxkbcommon0 libnss3 libasound2 libxcomposite1 libxdamage1 libxrandr2 libxtst6 libatk1.0-0 libatk-bridge2.0-0 libdrm2 libgbm1 libcups2 libxkbcommon-x11-0 libxcb-cursor0 libxcb-icccm4 libxcb-image0 libxcb-keysyms1 libxcb-randr0 libxcb-render-util0 libxcb-shape0 libxcb-xfixes0 libxcb-xinerama0 libfontconfig1 dpkg-dev
      - name: Windows NSIS
        if: matrix.pack == 'windows'
        shell: pwsh
        run: |
          choco install nsis -y
          Add-Content $env:GITHUB_PATH "C:\Program Files (x86)\NSIS"
      - name: Compile search engine
        run: cargo build --manifest-path Extra/Source/src-tauri/Cargo.toml --release --no-default-features --features api --bin sreon-api
      - name: Place engine
        shell: bash
        run: |
          mkdir -p Browser/engine
          if [ -f Extra/Source/src-tauri/target/release/sreon-api.exe ]; then cp Extra/Source/src-tauri/target/release/sreon-api.exe Browser/engine/; fi
          if [ -f Extra/Source/src-tauri/target/release/sreon-api ]; then cp Extra/Source/src-tauri/target/release/sreon-api Browser/engine/; fi
          ls -la Browser/engine Extra/Source/src-tauri/target/release
      - run: python -m pip install -r Browser/requirements.txt
      - name: Disk image tool
        if: matrix.pack == 'macos'
        run: brew install create-dmg || true
      - name: Freeze Sreon
        run: python -u Browser/tools/build.py --skip-engine
      - name: Test Mac app opens
        if: matrix.pack == 'macos'
        run: |
          ls -lh Browser/dist/*.app || true
          ls -lh Browser/dist/*.dmg Browser/dist/*.pkg 2>&1 || true
          file Browser/dist/Sreon.app/Contents/MacOS/Sreon || true
          plutil -p Browser/dist/Sreon.app/Contents/Info.plist | head -30 || true
          echo "Checking Sreon.app structure"
          ls -R Browser/dist/Sreon.app/Contents | head -100
          echo "Trying offscreen launch for 5 seconds"
          QT_QPA_PLATFORM=offscreen timeout 8 Browser/dist/Sreon.app/Contents/MacOS/Sreon || echo "exit code $?"
          echo "Checking Installer app"
          ls -lh Browser/dist/Sreon\ Installer.app || true
          ls -lh Browser/dist/Sreon\ Installer.app/Contents/MacOS/* || true
          echo "Verifying DMG"
          hdiutil verify Browser/dist/Sreon.dmg
          mkdir -p /tmp/sreon-check
          hdiutil attach -readonly -noverify -noautoopen -mountpoint /tmp/sreon-check Browser/dist/Sreon.dmg
          ls -la /tmp/sreon-check
          ls -la /tmp/sreon-check/Sreon.app || true
          ls -la /tmp/sreon-check/Sreon\ Installer.app || true
          hdiutil detach /tmp/sreon-check -force || true
          hdiutil detach /Volumes/Sreon -force || true
          if [ -f Browser/dist/Sreon.pkg ]; then
            echo "PKG exists"
            pkgutil --check-signature Browser/dist/Sreon.pkg || true
          fi
      - name: Test Windows installer
        if: matrix.pack == 'windows'
        shell: pwsh
        run: |
          dir Browser/dist
          if (Test-Path Browser/dist/Sreon/Sreon.exe) { Write-Host "Sreon.exe exists" } else { Write-Host "Missing Sreon.exe"; exit 1 }
          if (Test-Path Browser/dist/SreonSetup.exe) { Write-Host "Setup exists"; Get-Item Browser/dist/SreonSetup.exe | Format-List } else { Write-Host "No Setup, checking installer"; dir Browser/dist/Sreon\ Installer* }
          if (Test-Path Browser/dist/Sreon\ Installer/Sreon\ Installer.exe) { Write-Host "Installer exe exists" }
      - name: Test Linux installer
        if: matrix.pack == 'linux'
        run: |
          ls -lh Browser/dist/
          file Browser/dist/Sreon/Sreon || true
          ls -lh Browser/dist/*.deb || true
          if [ -f Browser/dist/sreon_0.5.0_amd64.deb ]; then dpkg-deb -c Browser/dist/sreon_0.5.0_amd64.deb | head -30; fi
          echo "Checking desktop file"
          cat Browser/dist/Sreon/If-it-says-unverified.txt | head -20 || true
      - name: Freeze log
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: freeze-log-${{ matrix.pack }}
          path: Browser/freeze.log
          if-no-files-found: warn
      - name: Show freeze log on failure
        if: failure()
        shell: bash
        run: |
          echo "=== freeze.log tail ==="
          tail -n 200 Browser/freeze.log || true
          echo "=== freeze.log full ===" >> $GITHUB_STEP_SUMMARY
          cat Browser/freeze.log >> $GITHUB_STEP_SUMMARY 2>&1 || echo "no log" >> $GITHUB_STEP_SUMMARY
      - name: Windows folder
        if: matrix.pack == 'windows'
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path out/Windows | Out-Null
          Copy-Item -Recurse Browser/dist/Sreon/* out/Windows/
          if (Test-Path Browser/dist/SreonSetup.exe) { Copy-Item Browser/dist/SreonSetup.exe out/Windows/ }
          if (Test-Path Browser/dist/Sreon\ Installer) { Copy-Item -Recurse Browser/dist/Sreon\ Installer out/Windows/ -ErrorAction SilentlyContinue }
          if (Test-Path Browser/dist/Sreon\ Installer.exe) { Copy-Item Browser/dist/Sreon\ Installer.exe out/Windows/ -ErrorAction SilentlyContinue }
          Copy-Item If-it-says-unverified.txt out/Windows/
          Copy-Item unable.txt out/Windows/ -ErrorAction SilentlyContinue
          dir out/Windows | Format-List
      - name: macOS folder
        if: matrix.pack == 'macos'
        run: |
          mkdir -p out/macOS
          cp Browser/dist/Sreon.dmg out/macOS/
          cp Browser/dist/Sreon-plain.dmg out/macOS/ || true
          cp Browser/dist/Sreon.app.zip out/macOS/ || true
          cp Browser/dist/Sreon.pkg out/macOS/ || true
          if [ -d "Browser/dist/Sreon Installer.app" ]; then cp -a "Browser/dist/Sreon Installer.app" out/macOS/ || true; fi
          cp If-it-says-unverified.txt out/macOS/
          cp unable.txt out/macOS/ || true
          ls -lh out/macOS/
      - name: Linux folder
        if: matrix.pack == 'linux'
        run: |
          mkdir -p out/Linux
          cp Browser/dist/Sreon-linux.tar.gz out/Linux/
          cp Browser/dist/*.deb out/Linux/ || true
          cp If-it-says-unverified.txt out/Linux/
          cp unable.txt out/Linux/ || true
          if [ -d "Browser/dist/Sreon Installer" ]; then cp -a "Browser/dist/Sreon Installer" out/Linux/ || true; fi
          curl -L -o appimagetool "https://github.com/AppImage/appimagetool/releases/download/continuous/appimagetool-x86_64.AppImage"
          chmod +x appimagetool
          mkdir -p AppDir/usr/bin
          cp -a Browser/dist/Sreon/. AppDir/usr/bin/
          printf '%s\n' '[Desktop Entry]' 'Type=Application' 'Name=Sreon' 'Exec=Sreon' 'Icon=sreon' 'Categories=Network;WebBrowser;' > AppDir/sreon.desktop
          cp Browser/assets/mark.png AppDir/sreon.png
          ARCH=x86_64 ./appimagetool -n AppDir out/Linux/Sreon.AppImage || true
          ls -lh out/Linux/
      - uses: actions/upload-artifact@v4
        if: success()
        with:
          name: sreon-${{ matrix.pack }}
          path: out

  assemble:
    needs: build
    if: ${{ always() && !cancelled() }}
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
      - name: One folder
        run: |
          mkdir -p Sreon
          cp Extra/HOW-IT-WORKS.md Sreon/HOW-IT-WORKS.md
          cp unable.txt Sreon/unable.txt
          cp If-it-says-unverified.txt Sreon/If-it-says-unverified.txt
          if [ -d artifacts/sreon-windows/Windows ]; then cp -a artifacts/sreon-windows/Windows Sreon/Windows; fi
          if [ -d artifacts/sreon-macos/macOS ]; then cp -a artifacts/sreon-macos/macOS Sreon/macOS; fi
          if [ -d artifacts/sreon-linux/Linux ]; then cp -a artifacts/sreon-linux/Linux Sreon/Linux; fi
          mkdir -p Sreon/Website Sreon/Source
          cp -a index.html CNAME site Sreon/Website/
          rsync -a --exclude node_modules --exclude .venv --exclude dist --exclude target --exclude __pycache__ Browser Extra/Source Extra/HOW-IT-WORKS.md Sreon/Source/
          python3 - <<'PY'
          import zipfile
          from pathlib import Path
          root = Path('Sreon')
          with zipfile.ZipFile('Sreon.zip', 'w', zipfile.ZIP_DEFLATED) as archive:
              for path in root.rglob('*'):
                  if path.is_file():
                      archive.write(path, path.as_posix())
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: Sreon
          path: |
            Sreon
            Sreon.zip
      - name: Publish download
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release delete sreon-preview --yes || true
          extras=""
          if [ -f Sreon/macOS/Sreon.dmg ]; then cp Sreon/macOS/Sreon.dmg Sreon.dmg; extras="Sreon.dmg"; fi
          if [ -f Sreon/macOS/Sreon.pkg ]; then cp Sreon/macOS/Sreon.pkg Sreon.pkg; extras="$extras Sreon.pkg"; fi
          if [ -f Sreon/Windows/SreonSetup.exe ]; then cp Sreon/Windows/SreonSetup.exe SreonSetup.exe; extras="$extras SreonSetup.exe"; fi
          if [ -f Sreon/Linux/sreon_0.5.0_amd64.deb ]; then cp Sreon/Linux/sreon_0.5.0_amd64.deb sreon.deb; extras="$extras sreon.deb"; fi
          if [ -f Sreon/macOS/Sreon-plain.dmg ]; then cp Sreon/macOS/Sreon-plain.dmg Sreon-plain.dmg; extras="$extras Sreon-plain.dmg"; fi
          if [ -f Sreon/macOS/Sreon.app.zip ]; then cp Sreon/macOS/Sreon.app.zip Sreon.app.zip; extras="$extras Sreon.app.zip"; fi
          gh release create sreon-preview Sreon.zip $extras --title "Sreon" --notes "Installers: Mac Sreon.dmg contains Sreon.app + Sreon Installer.app with beautiful UI and loading. Drag to Applications or run Installer. If DMG won't open: Control-click -> Open, or xattr -dr com.apple.quarantine Sreon.dmg, or hdiutil attach Sreon.dmg -noverify. PKG alternative: Sreon.pkg installs to Applications. Windows: SreonSetup.exe installs to Program Files and appears in Start Menu. If SmartScreen: More info -> Run anyway. Linux: sreon.deb installs to /opt and appears in Applications, or AppImage. See If-it-says-unverified.txt." --target "${GITHUB_SHA}"
