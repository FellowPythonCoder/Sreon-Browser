use_default_settings:
  engines:
    keep_only:
      - brave
      - duckduckgo
      - wikipedia
      - bing images
      - duckduckgo images
      - bing news
      - bing videos

general:
  instance_name: Sreon
  debug: false
  enable_metrics: false

search:
  safe_search: 1
  autocomplete: ""
  default_lang: auto
  formats:
    - html
    - json

server:
  secret_key: SREON_GENERATED_SECRET
  bind_address: 0.0.0.0
  port: 8080
  limiter: false
  public_instance: false
  image_proxy: false

outgoing:
  request_timeout: 6.0
  max_request_timeout: 12.0
  pool_connections: 20
  pool_maxsize: 10

engines:
  - name: brave
    disabled: false
  - name: duckduckgo
    disabled: false
  - name: wikipedia
    disabled: false
    display_type:
      - list
  - name: bing images
    disabled: false
  - name: duckduckgo images
    disabled: false
  - name: bing news
    disabled: false
  - name: bing videos
    disabled: false
